<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AqiveLife - 忘記密碼</title>
    <!-- 品牌字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/shared.css">
    <script src="assets/js/shared.js" defer></script>
    <style>
        body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background: url('assets/images/backgrounds/login-bg.jpg') no-repeat center center;
            background-size: cover;
        }

        .status-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: transparent;
            color: #000;
        }

        .status-bar-left {
            font-weight: 600;
            font-size: 16px;
        }

        .status-bar-right {
            display: flex;
            gap: 6px;
            font-size: 16px;
        }

        .forgot-password-container {
            height: calc(100% - 44px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            box-sizing: border-box;
            position: relative;
        }

        /* 返回按鈕 */
        .back-button {
            position: absolute;
            top: 20px;
            left: 30px;
            background: none;
            border: none;
            font-size: 24px;
            color: #333;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: rgba(0,0,0,0.1);
        }

        /* LOGO 區域 */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text img {
            height: 35px;
            object-fit: contain;
        }

        /* 標題與說明 */
        .page-title {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .page-description {
            font-size: 16px;
            color: #666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 40px;
            max-width: 300px;
        }

        /* 表單 */
        .form-container {
            width: 100%;
            max-width: 400px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
            background-color: rgba(255,255,255,0.9);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: #FF9D4D;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(255,157,77,0.1);
        }

        .input-field::placeholder {
            color: #999;
        }

        .send-btn {
            width: 100%;
            background-color: #FF9D4D;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 18px 0;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,157,77,0.3);
            margin-bottom: 20px;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .send-btn:hover {
            background-color: #FF8C2E;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,157,77,0.4);
        }

        .send-btn:active { transform: translateY(0); }
        .send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .back-to-login a {
            color: #FF9D4D;
            text-decoration: none;
            font-weight: 500;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: rgba(231,76,60,0.1);
            border-radius: 25px;
        }

        .success-message {
            display: none;
            color: #27ae60;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: rgba(39,174,96,0.1);
            border-radius: 25px;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 圖示區域 */
        .icon-section {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .forgot-icon {
            width: 80px;
            height: 80px;
            background-color: rgba(255,157,77,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #FF9D4D;
        }

        /* 成功狀態 */
        .success-state {
            display: none;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background-color: rgba(39,174,96,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #27ae60;
            margin: 0 auto 20px;
        }

        .success-title {
            font-size: 20px;
            color: #333;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .success-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- iOS 狀態欄 -->
    <div class="status-bar">
        <div class="status-bar-left"><div class="status-bar-time">8:38</div></div>
        <div class="status-bar-right">
            <div class="status-bar-signal"><i class="fas fa-signal"></i></div>
            <div class="status-bar-wifi"><i class="fas fa-wifi"></i></div>
            <div class="status-bar-battery"><i class="fas fa-battery-full"></i></div>
        </div>
    </div>

    <!-- 忘記密碼內容 -->
    <div class="forgot-password-container">
        <button class="back-button" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>

        <div class="logo-section">
            <div class="logo-icon"><img src="assets/images/logo/aqive-symbol.svg" alt="Aqive Symbol"></div>
            <div class="logo-text"><img src="assets/images/logo/aqive-wordmark.svg" alt="Aqive"></div>
        </div>

        <!-- 預設狀態 -->
        <div id="defaultState">
            <div class="icon-section">
                <div class="forgot-icon">
                    <i class="fas fa-key"></i>
                </div>
            </div>

            <h1 class="page-title">忘記密碼？</h1>
            <p class="page-description">請輸入您的 Email 地址，我們將發送重設密碼的連結給您</p>

            <div class="form-container">
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
                
                <form id="forgotPasswordForm">
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="請輸入您的 Email" required>
                    </div>
                    
                    <button type="submit" class="send-btn" id="sendBtn">
                        <div class="loading" id="loading"></div>
                        <span id="sendBtnText">發送重設連結</span>
                    </button>
                </form>
                
                <div class="back-to-login">
                    記起密碼了？<a href="email-login.html">返回登入</a>
                </div>
            </div>
        </div>

        <!-- 成功狀態 -->
        <div id="successState" class="success-state">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="success-title">郵件已發送！</h2>
            <p class="success-description">
                我們已經將重設密碼的連結發送到您的 Email<br>
                <strong id="sentEmail"></strong><br><br>
                請檢查您的收件匣（包含垃圾郵件資料夾）
            </p>
            <button class="send-btn" onclick="goToLogin()">返回登入</button>
            <div class="back-to-login">
                沒有收到郵件？<a href="#" onclick="resendEmail()">重新發送</a>
            </div>
        </div>
    </div>

<script>
    // 返回
    function goBack() { window.history.back(); }

    // 前往登入頁面
    function goToLogin() { window.location.href = 'email-login.html'; }

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorMessage').style.display = 'none';
    }

    function showSuccess(msg) {
        const el = document.getElementById('successMessage');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideSuccess() {
        document.getElementById('successMessage').style.display = 'none';
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('sendBtn');
        const spinner = document.getElementById('loading');
        const text = document.getElementById('sendBtnText');
        
        if (isLoading) {
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            text.textContent = '發送中...';
        } else {
            btn.disabled = false;
            spinner.style.display = 'none';
            text.textContent = '發送重設連結';
        }
    }

    // Email 驗證
    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    // 顯示成功狀態
    function showSuccessState(email) {
        document.getElementById('defaultState').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
        document.getElementById('sentEmail').textContent = email;
    }

    // 重新發送郵件
    function resendEmail() {
        const email = document.getElementById('email').value;
        if (email) {
            sendResetEmail(email);
        }
    }

    // 發送重設郵件
    function sendResetEmail(email) {
        hideError();
        hideSuccess();
        setLoading(true);

        // 模擬 API 調用
        setTimeout(() => {
            setLoading(false);
            
            // 模擬成功/失敗 (90% 成功率)
            const success = Math.random() > 0.1;
            
            if (success) {
                showSuccessState(email);
            } else {
                showError('發送失敗，請稍後再試或聯繫客服');
            }
        }, 2000);
    }

    // 表單提交
    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        
        if (!email) {
            showError('請輸入您的 Email 地址');
            return;
        }
        
        if (!isValidEmail(email)) {
            showError('請輸入有效的 Email 地址');
            return;
        }

        sendResetEmail(email);
    });

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 自動聚焦到 email 輸入框
        document.getElementById('email').focus();
    });
</script>
</body>
</html>
